[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --alluredir=allure-results --clean-alluredir
log_level = INFO
markers = 
    smoke: fast, critical-path checks
    regression: full regression suite
    registration: customer registration
    login: authentication
    search: product search
    catalog: category browsing and sorting
    product: product details page
    cart: shopping cart
    wishlist: wish list
    compare: product comparison
    account: my-account area
    contact: contact form
    checkout: checkout entry points
